<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>NEXT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e11; --card:#141920; --line:#232c36; --bone:#e6ebf0; --mute:#7d8a99;
  --accent:#36d6e7; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --disp:'Bebas Neue',sans-serif; --data:'IBM Plex Mono',monospace; --ui:'Inter',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--bone);font-family:var(--ui);
  font-size:15px;line-height:1.5;padding:0 16px 40px;max-width:560px;margin:0 auto;
  padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:baseline;justify-content:space-between;padding:22px 0 14px}
h1{font-family:var(--disp);font-size:30px;letter-spacing:.06em;margin:0;line-height:1}
.sub{font-family:var(--data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
button{font-family:var(--ui);font-size:15px;font-weight:600;cursor:pointer;border:none;
  border-radius:11px;padding:13px;background:var(--accent);color:#07252a;width:100%}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--bone);font-weight:500}
button:active{opacity:.75}
input,select{width:100%;background:#0e1319;border:1px solid var(--line);border-radius:10px;
  padding:12px;color:var(--bone);font-family:var(--data);font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-family:var(--data);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);margin:0 0 5px}
.row{display:grid;gap:9px;margin-bottom:11px}
.c2{grid-template-columns:1fr 1fr} .c3{grid-template-columns:1fr 1fr 1fr}
.ex{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ex:last-child{border-bottom:none}
.ex-n{flex:1;min-width:0}
.ex-t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-m{font-family:var(--data);font-size:11px;color:var(--mute);margin-top:2px}
.ex-w{font-family:var(--disp);font-size:27px;letter-spacing:.02em;line-height:1;white-space:nowrap}
.big{text-align:center;padding:8px 0 4px}
.big .k{font-family:var(--data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.big .v{font-family:var(--disp);font-size:68px;line-height:.98;letter-spacing:.01em;margin:3px 0}
.big .s{font-family:var(--data);font-size:12px;color:var(--mute)}
.why{background:#0e1319;border-left:2px solid var(--accent);border-radius:0 9px 9px 0;
  padding:11px 13px;font-size:13.5px;line-height:1.6;color:#c3cdd8;margin:14px 0}
.why b{color:var(--bone);font-weight:600}
.search{margin-bottom:12px}
.empty{text-align:center;color:var(--mute);font-family:var(--data);font-size:12px;padding:22px 0}
.pill{display:inline-block;font-family:var(--data);font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--line);color:var(--mute);margin-left:6px}
.back{font-family:var(--data);font-size:11px;color:var(--accent);cursor:pointer;
  letter-spacing:.08em;text-transform:uppercase;padding:6px 0;display:inline-block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--accent);
  color:#07252a;font-weight:600;font-size:14px;padding:11px 20px;border-radius:11px;
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:50}
.toast.on{opacity:1}
.hist{font-family:var(--data);font-size:11.5px;color:var(--mute);
  display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:none}
.foot{text-align:center;font-family:var(--data);font-size:10px;color:var(--mute);
  letter-spacing:.09em;margin-top:26px;line-height:2}
.foot span{cursor:pointer;color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>NEXT</h1>
  <div class="sub" id="hdr">—</div>
</header>

<div id="app"></div>

<div class="foot">
  <span onclick="doImport()">Import backup</span> ·
  <span onclick="doExport()">Export</span>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json" style="display:none">

<script>
/* ============================================================
   NEXT — one job: tell you what weight to use.

   Built for high-rep, high-rotation training (Humiston/Swole style),
   where exercises change constantly and sets run 15-30 reps. That breaks
   fixed-increment overload: +5 lbs on a 16 lb lateral raise is a 30% jump.
   Everything here works in percentages against the rep range instead.
   ============================================================ */

var K={lifts:'apl_lifts',ex:'apl_ex'};
function $(i){return document.getElementById(i);}
function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return [];}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('Storage full','var(--bad)');}}
function uid(){return Date.now()+Math.random();}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function today(){
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver'}).format(new Date());}
  catch(e){return new Date().toISOString().slice(0,10);}
}
function daysAgo(d){
  var a=new Date(d+'T12:00:00'),b=new Date(today()+'T12:00:00');
  return Math.round((b-a)/86400000);
}
function fmtAgo(d){
  var n=daysAgo(d);
  return n===0?'today':n===1?'yesterday':n+'d ago';
}
function toast(m,c){
  var t=$('toast'); t.textContent=m; t.style.background=c||'var(--accent)';
  t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},1700);
}
/* Normalize for matching so "Cable side laterales" finds "Cable side lateral". */
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'');}

/* ---------- data ---------- */
function lifts(){return load(K.lifts).sort(function(a,b){return b.date.localeCompare(a.date);});}
function histFor(name){
  var n=norm(name);
  return lifts().filter(function(x){return norm(x.ex)===n;});
}
/* Every exercise ever logged, most recently used first. */
function exercises(){
  var seen={},out=[];
  lifts().forEach(function(x){
    var n=norm(x.ex);
    if(seen[n])return;
    seen[n]=1; out.push({name:x.ex,last:x});
  });
  return out;
}
/* Saved rep ranges, keyed by normalized name. */
function ranges(){
  var m={}; load(K.ex).forEach(function(e){m[norm(e.name)]=e;});
  return m;
}
function rangeFor(name,fallbackReps){
  var r=ranges()[norm(name)];
  if(r)return r;
  // Infer a sensible range from what was actually done.
  var rp=num(fallbackReps)||12;
  if(rp<=6)return {lo:4,hi:6};
  if(rp<=10)return {lo:8,hi:12};
  if(rp<=16)return {lo:12,hi:16};
  if(rp<=22)return {lo:15,hi:20};
  return {lo:20,hi:30};
}
function setRange(name,lo,hi){
  var d=load(K.ex), n=norm(name), f=d.filter(function(e){return norm(e.name)===n;})[0];
  if(f){f.lo=lo;f.hi=hi;} else d.push({name:name,lo:lo,hi:hi});
  save(K.ex,d);
}

/* ---------- the overload engine ----------
   Double progression: earn the top of the rep range at a real RPE,
   then the weight moves. Increment is a percentage, because a fixed
   number is meaningless across a 16 lb cable and a 320 lb deadlift. */
function roundLoad(w){
  if(w>=60)return Math.round(w/5)*5;
  if(w>=20)return Math.round(w/2.5)*2.5;
  return Math.round(w);
}
function pctFor(reps){
  // Heavier, lower-rep work tolerates bigger relative jumps.
  if(reps<=6)return 0.04;
  if(reps<=12)return 0.03;
  return 0.025;
}
function nextLoad(name){
  var h=histFor(name);
  if(!h.length)return null;
  var last=h[0], w=num(last.w), r=num(last.reps), rpe=num(last.rpe);
  if(!w)return null;

  // No rep count means no basis for a decision. Hold, and say why — never
  // deload someone because a field was left blank.
  if(!r)
    return {w:w,reps:'?',up:false,
      why:'No rep count on your last set, so there is nothing to progress against. '+
          'Repeat <b>'+w+'</b> and log reps this time — that is the number the whole '+
          'calculation runs on.'};

  var rg=rangeFor(name,r);
  var pct=pctFor(r), step=Math.max(roundLoad(w*pct),w>=60?5:w>=20?2.5:1);
  // Describe the jump you actually get after rounding, not the theoretical one.
  function up(target){
    target=roundLoad(target);
    if(target<=w)target=roundLoad(w+(w>=60?5:w>=20?2.5:1));
    return {t:target,d:Math.round((target-w)*10)/10,p:Math.round((target-w)/w*100)};
  }

  // Near failure overrides everything — you don't add load on top of a grinder.
  if(rpe>=9.5)
    return {w:w,reps:rg.lo+'–'+rg.hi,up:false,
      why:'Last set was RPE '+rpe+' — effectively failure. Repeat <b>'+w+
          '</b> and earn it at a lower RPE before the weight moves.'};

  if(r>=rg.hi){
    var a=up(rpe&&rpe<=8 ? w+step : w+step/2);
    return {w:a.t,reps:rg.lo+'–'+rg.hi,up:true,
      why:(rpe&&rpe<=8
        ? 'You hit <b>'+r+' reps at RPE '+rpe+'</b> — top of the range with something left. '
        : 'Top of the range at RPE '+(rpe||'?')+', so a smaller step. ')+
        'Add <b>'+a.d+' lbs</b> ('+a.p+'%) and drop back toward '+rg.lo+' reps.'};
  }
  if(r>=rg.lo){
    if(rpe&&rpe<=7)
      return {w:w,reps:(r+2)+'+',up:false,
        why:'<b>'+r+' reps at RPE '+rpe+'</b> — you had more in you. Same weight, chase '+
            (r+2)+'+ reps this time. Weight moves when you reach '+rg.hi+'.'};
    return {w:w,reps:(r+1)+'–'+rg.hi,up:false,
      why:'<b>'+r+' reps</b>, inside your '+rg.lo+'–'+rg.hi+' range. Hold '+w+
          ' and add reps. Weight moves at '+rg.hi+'.'};
  }
  var down=roundLoad(w-step); if(down>=w)down=w-(w>=60?5:w>=20?2.5:1);
  return {w:down,reps:rg.lo+'–'+rg.hi,up:false,
    why:'Only <b>'+r+' reps</b>, under your '+rg.lo+'-rep floor. Drop to '+down+
        ' and rebuild — grinding a weight you can\'t rep is how joints get angry.'};
}
/* Nothing logged for this exercise yet — offer the closest thing you have done. */
function nearest(name){
  var n=norm(name), best=null, bestScore=0;
  exercises().forEach(function(e){
    var m=norm(e.name), score=0, i;
    for(i=3;i<=m.length;i++){ if(n.indexOf(m.slice(0,i))>=0)score=i; }
    for(i=3;i<=n.length;i++){ if(m.indexOf(n.slice(0,i))>=0&&i>score)score=i; }
    if(score>bestScore){bestScore=score;best=e;}
  });
  return bestScore>=4?best:null;
}

/* ---------- views ---------- */
var VIEW={v:'list',ex:null,q:''};
function go(v,ex){VIEW.v=v;VIEW.ex=ex||null;render();window.scrollTo(0,0);}

function render(){
  var L=lifts();
  $('hdr').textContent=L.length?L.length+' sets · '+exercises().length+' lifts':'no data yet';
  if(VIEW.v==='log')return renderLog();
  renderList();
}

function renderList(){
  var ex=exercises(), q=norm(VIEW.q);
  var shown=q?ex.filter(function(e){return norm(e.name).indexOf(q)>=0;}):ex;
  var h='<div class="search"><input id="q" placeholder="Search or add an exercise" value="'+
        String(VIEW.q).replace(/"/g,'&quot;')+'"></div>';

  if(VIEW.q&&!shown.length){
    h+='<div class="card"><div class="empty">No match for "'+VIEW.q+'"</div>'+
       '<button onclick="go(\'log\',\''+esc(VIEW.q)+'\')">Log &ldquo;'+VIEW.q+'&rdquo; as new</button></div>';
  }
  if(shown.length){
    h+='<div class="card">'+shown.map(function(e){
      var n=nextLoad(e.name);
      var col=!n?'var(--mute)':n.up?'var(--good)':'var(--bone)';
      return '<div class="ex" onclick="go(\'log\',\''+esc(e.name)+'\')">'+
        '<div class="ex-n"><div class="ex-t">'+e.name+'</div>'+
        '<div class="ex-m">'+e.last.w+' × '+(e.last.reps||'?')+
          (e.last.rpe?' @'+e.last.rpe:'')+' · '+fmtAgo(e.last.date)+'</div></div>'+
        '<div class="ex-w" style="color:'+col+'">'+(n?n.w:'—')+'</div></div>';
    }).join('')+'</div>';
  }
  if(!ex.length&&!VIEW.q){
    h+='<div class="card"><div class="empty">Nothing logged yet.<br>'+
       'Import your backup below, or search above to add a lift.</div></div>';
  }
  $('app').innerHTML=h;
  var qi=$('q');
  qi.addEventListener('input',function(){VIEW.q=this.value;renderList();
    var e=$('q');e.focus();e.setSelectionRange(e.value.length,e.value.length);});
}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

function renderLog(){
  var name=VIEW.ex, h=histFor(name), n=nextLoad(name), near=!h.length?nearest(name):null;
  var last=h[0], rg=rangeFor(name,last?last.reps:0);
  var out='<div class="back" onclick="go(\'list\')">&larr; All lifts</div>';

  out+='<div class="card"><div style="font-weight:600;font-size:17px;margin-bottom:2px">'+name+'</div>'+
    '<div class="ex-m">target '+rg.lo+'–'+rg.hi+' reps'+
    (h.length?' · '+h.length+' session'+(h.length===1?'':'s')+' logged':' · new')+'</div>';

  if(n){
    out+='<div class="big"><div class="k">Use today</div>'+
      '<div class="v" style="color:'+(n.up?'var(--good)':'var(--bone)')+'">'+n.w+'</div>'+
      '<div class="s">for '+n.reps+' reps</div></div>'+
      '<div class="why">'+n.why+'</div>';
  } else if(near){
    var nn=nextLoad(near.name);
    out+='<div class="why">First time logging this. Closest thing you\'ve done is <b>'+near.name+
      '</b> at '+near.last.w+' × '+(near.last.reps||'?')+'. Start conservative'+
      (nn?' — somewhere near <b>'+nn.w+'</b>':'')+' and let the next session set the real number.</div>';
  } else {
    out+='<div class="why">First time logging this. Pick a weight you can control for '+
      rg.lo+'–'+rg.hi+' clean reps and stop 2 short of failure. Next session gets a real number.</div>';
  }
  out+='</div>';

  out+='<div class="card"><div class="sub" style="margin-bottom:11px">Log what you actually did</div>'+
    '<div class="row c3">'+
      '<div><label>Weight</label><input type="number" inputmode="decimal" id="f-w" value="'+(n?n.w:'')+'"></div>'+
      '<div><label>Reps</label><input type="number" inputmode="numeric" id="f-r"></div>'+
      '<div><label>RPE</label><input type="number" inputmode="decimal" step="0.5" id="f-e" placeholder="8"></div>'+
    '</div>'+
    '<button onclick="logSet()">Save set</button>'+
    '<div class="row c2" style="margin-top:14px">'+
      '<div><label>Rep range low</label><input type="number" id="f-lo" value="'+rg.lo+'"></div>'+
      '<div><label>Rep range high</label><input type="number" id="f-hi" value="'+rg.hi+'"></div>'+
    '</div>'+
    '<button class="ghost" onclick="saveRange()">Save rep range</button></div>';

  if(h.length){
    out+='<div class="card"><div class="sub" style="margin-bottom:9px">History</div>'+
      h.slice(0,12).map(function(x){
        return '<div class="hist"><span>'+x.date+'</span>'+
          '<span>'+x.w+' × '+(x.reps||'?')+(x.rpe?' @'+x.rpe:'')+
          ' <span onclick="delSet('+x.id+')" style="color:var(--bad);padding-left:8px">✕</span></span></div>';
      }).join('')+'</div>';
  }
  $('app').innerHTML=out;
}

function logSet(){
  var w=num($('f-w').value);
  if(!w){toast('Enter a weight','var(--bad)');return;}
  var d=load(K.lifts);
  d.push({id:uid(),date:today(),ex:VIEW.ex,w:w,reps:num($('f-r').value),rpe:num($('f-e').value)});
  save(K.lifts,d);
  toast('Logged');
  render();
}
function saveRange(){
  var lo=num($('f-lo').value),hi=num($('f-hi').value);
  if(!lo||!hi||hi<lo){toast('Check the range','var(--bad)');return;}
  setRange(VIEW.ex,lo,hi); toast('Range saved'); render();
}
function delSet(id){
  save(K.lifts,load(K.lifts).filter(function(x){return x.id!==id;}));
  toast('Deleted'); render();
}

/* ---------- backup ---------- */
function doExport(){
  var blob=new Blob([JSON.stringify({lifts:load(K.lifts),ex:load(K.ex),_v:1},null,1)],
    {type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='next-'+today()+'.json'; a.click();
}
function doImport(){$('file').click();}
$('file').addEventListener('change',function(ev){
  var f=ev.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result), cur=load(K.lifts), add=0;
      // Accepts this app's own export, or an ACEPEAK backup (old or ap8_ era).
      var src=d.lifts||[];
      src.forEach(function(x){
        var name=x.ex||x.lift; if(!name)return;
        var date=x.date||today();
        if(cur.some(function(c){return c.date===date&&norm(c.ex)===norm(name)&&num(c.w)===num(x.w||x.weight);}))return;
        cur.push({id:uid(),date:date,ex:String(name).trim(),w:num(x.w||x.weight),
          reps:num(x.reps),rpe:num(x.rpe||x.rir)});
        add++;
      });
      save(K.lifts,cur);
      if(d.ex)save(K.ex,d.ex);
      toast(add?add+' sets imported':'Nothing new');
      render();
    }catch(err){toast('Could not read that file','var(--bad)');}
  };
  r.readAsText(f);
  ev.target.value='';
});

/* Home-screen install + offline. Shares ACEPEAK's service worker, which is
   network-first for HTML — a fresh deploy still wins when you have signal,
   and the gym basement still opens the app. */
(function(){
  var m={name:'NEXT',short_name:'NEXT',start_url:'./lift.html',display:'standalone',
    background_color:'#0b0e11',theme_color:'#0b0e11',
    icons:[{src:'data:image/svg+xml;base64,'+btoa(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">'+
      '<rect width="192" height="192" rx="42" fill="#0b0e11"/>'+
      '<text x="96" y="128" font-family="sans-serif" font-size="96" font-weight="bold" '+
      'fill="#36d6e7" text-anchor="middle">N</text></svg>'),
      sizes:'192x192',type:'image/svg+xml'}]};
  var l=document.createElement('link');
  l.rel='manifest';
  l.href='data:application/json;base64,'+btoa(JSON.stringify(m));
  document.head.appendChild(l);
  if('serviceWorker' in navigator && location.protocol==='https:')
    navigator.serviceWorker.register('./sw.js').catch(function(){});
})();

render();
</script>
</body>
</html>
